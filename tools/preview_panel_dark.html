<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>AI 翻译设置 · 面板预览</title>
<style>html,body{margin:0;height:100%;background:#0d1117;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}</style>
</head><body><div id="host"></div><template id="tpl"><style>*{box-sizing:border-box}.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;padding:18px;animation:ghx-fade .14s ease}.card{--bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#d8dee4;--soft:#f6f8fa;--field:#fff;--accent:#1a7f37;--accent-h:#17803a;--ring:rgba(26,127,55,.25);--danger:#cf222e;--ok:#1a7f37;width:480px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.08);overflow:hidden;font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;animation:ghx-pop .18s cubic-bezier(.2,.8,.3,1)}@keyframes ghx-fade{from{opacity:0}to{opacity:1}}@keyframes ghx-pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}.head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}.head h4{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}.head p{margin:4px 0 0;font-size:12px;color:var(--muted)}.head-t{flex:1;min-width:0}.x{flex:0 0 auto;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}.x:hover{background:var(--soft);color:var(--fg)}.body{padding:2px 20px 6px;overflow:auto;overscroll-behavior:contain;flex:1 1 auto;scrollbar-width:thin;scrollbar-color:#c9d1d9 transparent}.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:#c9d1d9;border-radius:4px;border:2px solid transparent;background-clip:padding-box}.body::-webkit-scrollbar-thumb:hover{background:#adb7c0;background-clip:padding-box}.body::-webkit-scrollbar-track{background:transparent}.sec{padding:10px 0;border-bottom:1px solid var(--line)}.sec:last-child{border-bottom:0}.sec-t{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.field{display:block;margin-bottom:10px}.field:last-child{margin-bottom:2px}.field>span{display:block;font-size:12px;font-weight:500;color:var(--fg);margin-bottom:6px}input[type=text],input[type=password],input[type=number],select{width:100%;height:34px;padding:0 10px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}input::placeholder{color:#a0a8b0}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}.wrap{position:relative}.wrap input{padding-right:56px}.eye{position:absolute;right:4px;top:4px;height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}.eye:hover{background:var(--soft);color:var(--fg)}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}.grid3 .field{margin-bottom:8px}.grid3 .field>span{text-align:center}.grid3 input{text-align:center;padding:0 6px}.switch-row{display:flex;align-items:center;gap:14px;padding:7px 0}.switch-row+.switch-row{border-top:1px dashed var(--line)}.switch-row.tight{padding:9px 0}.switch-txt{flex:1;min-width:0}.switch-txt b{display:block;font-size:13px;font-weight:500}.switch-txt i{display:block;font-size:11.5px;font-style:normal;color:var(--muted);margin-top:2px}.sw{position:relative;display:inline-flex;flex:0 0 auto;cursor:pointer}.sw input{position:absolute;opacity:0;width:0;height:0}.sw span{position:relative;display:block;width:38px;height:22px;border-radius:11px;background:var(--line);transition:background .18s}.sw span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .18s}.sw input:checked+span{background:var(--accent)}.sw input:checked+span::after{transform:translateX(16px)}.sw input:focus-visible+span{box-shadow:0 0 0 3px var(--ring)}.foot{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:12px 20px 13px;border-top:1px solid var(--line);background:var(--soft)}.status{display:none;font-size:12px;line-height:1.6;color:var(--muted);word-break:break-word;white-space:normal;max-height:5.2em;overflow:auto}.status.show{display:block}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}.foot-act{display:flex;align-items:center;justify-content:flex-end;gap:8px}.btn{height:32px;padding:0 14px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);transition:background .15s,border-color .15s}.btn:hover{background:var(--soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}.btn.sm{height:28px;padding:0 11px;font-size:12px;flex:0 0 auto}.btn:disabled{opacity:.6;cursor:default}.dict-row{display:flex;align-items:center;gap:10px;padding:3px 0 2px}.dict-info{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.7;word-break:break-word}.dict-info b{color:var(--fg);font-weight:500}.dict-sub{font-size:11px;color:var(--muted);line-height:1.65;margin-top:1px;word-break:break-word}.dict-sub:empty{display:none}.fold{display:block}.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;margin:0}.fold>summary::-webkit-details-marker{display:none}.fold-tip{flex:1;min-width:0;font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;color:var(--muted)}.fold>summary::after{flex:0 0 auto;font-size:11px;color:var(--muted);content:"展开"}.fold[open]>summary{margin-bottom:8px}.fold[open]>summary::after{content:"收起"}.hint{font-size:11.5px;color:var(--muted);line-height:1.65;padding:1px 0}.hint code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;background:var(--soft);padding:1px 4px;border-radius:4px}.hint.warn{color:#d97706;background:rgba(217,119,6,.10);border:1px solid rgba(217,119,6,.35);border-radius:6px;padding:6px 8px;margin-top:6px}@media all{.card{--bg:#161b22;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--soft:#1c2128;--field:#0d1117;--accent:#238636;--accent-h:#2ea043;--ring:rgba(46,160,67,.3);--danger:#f85149;--ok:#3fb950}.mask{background:rgba(1,4,9,.68)}input::placeholder{color:#6e7681}.body{scrollbar-color:#484f58 transparent}.body::-webkit-scrollbar-thumb{background:#484f58;background-clip:padding-box}.body::-webkit-scrollbar-thumb:hover{background:#5b646e;background-clip:padding-box}}.mask,.card{animation:none!important}</style><div class="mask" id="mask"><div class="card" role="dialog" aria-modal="true" aria-label="AI 翻译设置"><div class="head"><div class="head-t"><h4>AI 翻译设置</h4><p>配置大模型接口，保存后立即在本标签页生效，不会触发翻译。</p></div><button class="x" id="close" type="button" title="关闭（Esc）" aria-label="关闭"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3.6 3.6l8.8 8.8M12.4 3.6l-8.8 8.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg></button></div><div class="body"><div class="sec"><div class="sec-t">运行方式</div><div class="switch-row"><div class="switch-txt"><b>启用 AI 翻译</b><i>优先走大模型；不可用时自动回退翻译引擎</i></div><label class="sw"><input type="checkbox" id="enb"><span></span></label></div><div class="switch-row"><div class="switch-txt"><b>非简体中文页面自动翻译</b><i>自动识别语种；只翻非简中页面，F9 仍可手动重译</i></div><label class="sw"><input type="checkbox" id="auto"><span></span></label></div></div><div class="sec"><div class="sec-t">接口</div><label class="field"><span>接口类型</span><select id="prov"><option value="nvidia">NVIDIA NIM</option><option value="openai">OpenAI 兼容接口</option><option value="builtin">浏览器内置 AI（免 Key）</option></select></label><label class="field"><span>接口地址 baseUrl</span><input type="text" id="url" spellcheck="false" placeholder="https://integrate.api.nvidia.com/v1/chat/completions"></label><div class="field"><span>API Key</span><div class="wrap"><input type="password" id="key" spellcheck="false" autocomplete="off" placeholder="粘贴你的 API Key，仅保存在本机"><button class="eye" id="eye" type="button" title="显示或隐藏 Key">显示</button></div></div><label class="field"><span>模型名称 model</span><input type="text" id="model" spellcheck="false" placeholder="nvidia/nemotron-3.5-super-vl-120b-a12b"></label></div><div class="sec"><div class="sec-t">参数</div><div class="grid3"><label class="field"><span>批量条数</span><input type="number" id="batch" min="1" max="100"></label><label class="field"><span>每条字符上限</span><input type="number" id="maxc" min="10" max="5000"></label><label class="field"><span>超时（毫秒）</span><input type="number" id="to" min="1000" max="600000"></label><label class="field"><span>设置快捷键</span><input type="text" id="openkey" spellcheck="false" placeholder="Alt+N"></label></div><div class="switch-row tight"><div class="switch-txt"><b>推理模型关闭思考</b><i>NVIDIA Nemotron 等推理模型需要开启</i></div><label class="sw"><input type="checkbox" id="think"><span></span></label></div><div class="switch-row tight"><div class="switch-txt"><b>译文写入缓存</b><i>同一句第二次出现直接命中，不重复请求</i></div><label class="sw"><input type="checkbox" id="cache"><span></span></label></div><div class="sec-t">界面词条</div><div class="dict-row"><div class="dict-info" id="dictinfo">读取中…</div><button class="btn sm" id="dictupd" type="button" title="每天北京时间 0 点后首次打开自动同步一次；GitHub 原始地址与 gh-proxy 反代同时发（谁先到用谁），失败再依次换 jsDelivr 两个域名">立即更新</button></div><div class="dict-sub" id="dictsub"></div></div><details class="sec fold" id="contribfold"><summary class="sec-t">词条回传<span class="fold-tip">采集未命中词条，攒够回传词条库</span></summary><div class="switch-row tight"><div class="switch-txt"><b>采集未命中词条</b><i>词库没翻到、靠 AI / 引擎翻出的短文案记录在本机，默认关闭</i></div><label class="sw"><input type="checkbox" id="contrib"><span></span></label></div><div class="dict-row"><div class="dict-info" id="contribinfo"></div><button class="btn sm" id="contribpush" type="button">推送到 GitHub</button></div><div class="dict-row"><button class="btn sm" id="ccopy" type="button">复制清单</button><button class="btn sm" id="cissue" type="button">提交 Issue</button></div><div class="field" style="margin-top:8px"><span>GitHub Token（需仓库写权限；仅保存在本机）</span><div class="wrap"><input type="password" id="ctoken" spellcheck="false" autocomplete="off" placeholder="粘贴你的 GitHub Token，仅保存在本机"><button class="eye" id="ceye" type="button" title="显示或隐藏 Token">显示</button></div></div><div class="field" style="margin-top:8px"><span>API 镜像（可不填，直连不通时自动启用）</span><input type="text" id="cmirror" spellcheck="false" autocomplete="off" placeholder="https://gh-proxy.com/https://api.github.com"></div><div class="switch-row tight"><div class="switch-txt"><b>只走镜像</b><i>api.github.com 完全打不开时打开：连直连都不试，直接走镜像</i></div><label class="sw"><input type="checkbox" id="cmironly"><span></span></label></div><div class="hint">两种回传方式：<b>推送到 GitHub</b> 直接写 <code>dict/contribs/</code>（需 Token）；<b>提交 Issue</b> 把清单发成 Issue——填了 Token 会用 API 建单（一次最多 300 条），没填就打开预填页面（按长度自动分批）。词条每天 12:20 合并进正式词库。</div><div class="hint warn">走镜像时，你的 Token 会经过第三方镜像服务器。建议改用<b>细粒度 Token</b>，只勾这一个仓库的 Contents 与 Issues 写权限，泄露也能一键撤销。介意的话把镜像填成你自己搭的地址。</div></details></div><div class="foot"><div class="status" id="ghx-msg"></div><div class="foot-act"><button class="btn" id="restore" type="button">恢复原文</button><button class="btn" id="test" type="button">测试连接</button><button class="btn primary" id="save" type="button">保存</button></div></div></div></div></template>
<script>
const sr=document.getElementById('host').attachShadow({mode:'open'});
sr.innerHTML=document.getElementById('tpl').innerHTML;
const q=(id)=>sr.getElementById(id);
q('enb').checked=true;q('auto').checked=true;q('think').checked=true;q('cache').checked=true;
q('prov').value='nvidia';
q('url').value='https://integrate.api.nvidia.com/v1/chat/completions';
q('key').value='demo-key-xxxxxxxxxxxxxxxxxxxx';
q('model').value='nvidia/nemotron-3.5-super-vl-120b-a12b';
q('batch').value=20;q('maxc').value=600;q('to').value=60000;
q('ghx-msg').textContent='';q('ghx-msg').className='status';   // 面板刚打开时状态行为空，更贴近真实首屏
q('dictinfo').innerHTML='版本 <b>2026.11.08</b> · 词库 <b>1816</b> 条 · GitHub 原始地址 · 3 分钟前同步';q('openkey').value='Alt+N';
if (q('contribfold')) q('contribfold').open = false;  // 默认收起，与真实首屏一致
q('contrib').checked=true;
q('ctoken').value='demo-token-xxxxxxxxxxxxxxxx';
q('contribinfo').innerHTML='本地已采集 <b>12</b> 条，可推送到仓库或提交 Issue';
q('dictsub').textContent='内置 1656 条 + 远端新增 160 条（远端 1815 条同名覆盖） · AI 记忆 409 条不计入（本机译文缓存）';
</script></body></html>
