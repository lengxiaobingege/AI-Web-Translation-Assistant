name: 词库 Issue 接收

# 用户没有 GitHub Token 时，会通过「提交 Issue」把采集到的词条发过来。
# 为避免任何人开 Issue 就往仓库写文件，本工作流**只在维护者给 Issue 打上
# 「词库贡献」标签时**才解析（打标 = 人工确认要处理这条）。
# 也可以从 Actions 页手动触发并填写 Issue 编号。
#
# 解析结果写入 dict/contribs/contrib-issue-<编号>.json，进入与脚本回传相同的队列；
# 正式合并仍需维护者手动触发「词库贡献合并」。
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '要解析的 Issue 编号'
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: dict-issue-parse
  cancel-in-progress: false

jobs:
  intake:
    name: 解析 Issue 词条
    # 打标触发时只认「词库贡献」这个标签；手动触发则无条件执行
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == '词库贡献'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 取回 Issue 正文
        id: fetch
        run: |
          N="${{ github.event.issue.number || github.event.inputs.issue_number }}"
          echo "num=${N}" >> $GITHUB_OUTPUT
          gh api "repos/${{ github.repository }}/issues/${N}" --jq '.body // ""' > issue_body.txt
          echo "正文长度：$(wc -c < issue_body.txt) 字节"

      - name: 解析词条
        id: parse
        env:
          ISSUE_NUMBER: ${{ steps.fetch.outputs.num }}
        run: |
          ISSUE_BODY="$(cat issue_body.txt)" node tools/issue_to_contrib.js

      - name: 提交到贡献队列
        id: commit
        if: steps.parse.outputs.count != '0'
        run: |
          FILE="dict/contribs/contrib-issue-${{ steps.fetch.outputs.num }}.json"
          if [ ! -f "$FILE" ]; then
            echo "::notice::没有生成贡献文件"
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "::notice::贡献文件已存在且内容相同，无需提交"
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "词库贡献：接收 Issue #${{ steps.fetch.outputs.num }} 的 ${{ steps.parse.outputs.count }} 条词条" \
                     -m "维护者打标确认后由 Issue 自动解析生成，待触发「词库贡献合并」进入正式词库。"
          git push origin HEAD:main
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: 回帖告知结果
        if: always() && steps.parse.outputs.count != ''
        uses: actions/github-script@v8
        env:
          COUNT: ${{ steps.parse.outputs.count }}
          SKIPPED: ${{ steps.parse.outputs.skipped }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        with:
          script: |
            const num = Number('${{ steps.fetch.outputs.num }}');
            const count = process.env.COUNT || '0';
            const skipped = process.env.SKIPPED || '0';
            const pushed = process.env.PUSHED === 'true';
            const body = count === '0'
              ? '未从本 Issue 中解析到可用词条。请确认每行格式为 `原文 → 译文`（一行一条），也可由维护者手动处理。'
              : [
                  `已接收 **${count}** 条词条${skipped !== '0' ? `（另有 ${skipped} 行因格式/超长/反向而跳过）` : ''}。`,
                  '',
                  pushed ? '已写入 `dict/contribs/`，等待维护者触发「词库贡献合并」；合并后所有用户会在次日自动同步。' : '贡献文件已存在，无需重复提交。',
                  '',
                  '感谢贡献！',
                ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body,
            });
